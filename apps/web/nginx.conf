server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app is a single-page app: every route is served by index.html and
    # resolved client-side by react-router. Without this, a refresh on any
    # route other than / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
